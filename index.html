<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trazo – Plataforma de arte</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceef2;--sf:#f7f8fa;--ink:#252c3d;--mute:#667085;--ln:rgba(0,0,0,.1);--acc:#4363d8;--ai:#f7f8fa;--ok:#1b8a5a;--no:#b8430f;--in:#e3e6ec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#12151c;--sf:#1a1f2b;--ink:#e6e9ef;--mute:#94a3b8;--ln:rgba(255,255,255,.08);--acc:#8aa6ff;--ai:#0f1320;--ok:#4cc38a;--no:#f0935f;--in:#222938;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Bricolage Grotesque",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:50}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{width:100%;padding:9px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--in)}
input[type=checkbox]{width:auto}label{display:block;font-weight:600;margin:12px 0 4px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a[data-go]{cursor:pointer;text-decoration:underline}
#side{position:fixed;left:0;top:env(safe-area-inset-top,0px);bottom:0;width:72px;background:var(--sf);border-right:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;z-index:30}
.lg{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--ai);display:grid;place-items:center;font-weight:800;font-size:22px;margin-bottom:8px;cursor:pointer;text-decoration:none!important}
.si{width:48px;height:48px;border-radius:14px;border:0;background:none;font-size:22px;cursor:pointer}.si:hover{background:var(--in)}.si.on{background:var(--in);outline:2px solid var(--acc)}
#top{margin-left:72px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:12px;align-items:center;padding:12px 28px;flex-wrap:wrap}
#sf{flex:1 1 260px;margin:0}#q{border-radius:99px;padding:12px 20px}#so{width:auto}
#app{margin-left:72px;padding:12px 28px 110px;max-width:1500px}
h1{font-size:clamp(26px,4vw,40px);line-height:1.15;margin:6px 0;letter-spacing:-.02em;font-weight:800}h2{font-size:20px;margin:26px 0 10px}h3{font-size:16px;margin:20px 0 8px}
.sub{color:var(--mute);margin:0 0 18px;max-width:64ch}.empty{color:var(--mute);padding:20px 0}small{color:var(--mute)}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-block;text-decoration:none}
.btn.p{background:var(--acc);color:var(--ai);border-color:var(--acc)}.btn.d{color:var(--no)}.btn[disabled]{opacity:.45;cursor:not-allowed}
.lnk{background:none;border:0;color:var(--mute);cursor:pointer;padding:0 8px 0 0;font-size:13px;text-decoration:underline}
.pill{display:inline-block;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:600;border:1px solid currentColor}.ok{color:var(--ok)}.no{color:var(--no)}
.tag{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:5px 14px;cursor:pointer;font-size:14px}.tag[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.mas{columns:5 230px;column-gap:22px}.card{break-inside:avoid;margin:0 0 24px;position:relative;cursor:pointer}
.card img{width:100%;display:block;border-radius:16px}.sv{position:absolute;top:10px;right:10px;padding:4px 9px}.cm2 small{display:block}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:20px;max-width:680px}.wide{max-width:900px}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}.cat{text-align:left;cursor:pointer;color:inherit}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.fl{flex:1 1 170px}
.list{display:grid;gap:10px;max-width:900px}.item{display:flex;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px;flex-wrap:wrap}
.item>img{width:60px;height:60px;object-fit:cover;border-radius:8px}.t{flex:1;min-width:150px}
.av{border-radius:50%;display:inline-grid;place-items:center;color:var(--ai);font-weight:700;flex:none}
.pf{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.big{font-size:22px}.sw{position:relative;margin:0}.sw input{position:absolute;opacity:0;width:auto}.sw span{display:block;width:30px;height:30px;border-radius:50%}.sw input:checked+span{outline:3px solid var(--acc);outline-offset:2px}
.drop{display:block;border:2px dashed var(--ln);border-radius:12px;padding:26px;text-align:center;color:var(--mute);cursor:pointer}
table{border-collapse:collapse;width:100%;max-width:900px}td,th{border-bottom:1px solid var(--ln);padding:8px;text-align:left}
.modal{position:fixed;inset:0;background:rgba(8,11,18,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}#dlg{z-index:60}.modal.open{display:flex}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:16px;max-width:1360px;width:100%;height:90vh;display:grid;grid-template-columns:62% 38%;overflow:hidden;position:relative}
.box2{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:22px;max-width:420px}
.pic,.info{min-height:0}.pic{background:var(--in);display:flex;align-items:center;justify-content:center;padding:32px;overflow:auto;position:relative}
.pic img{width:100%;max-height:100%;object-fit:contain;image-rendering:auto;border-radius:8px;transition:transform .2s}.zb{position:absolute;left:12px;bottom:12px}
.info{overflow:auto;padding:28px 26px;border-left:1px solid var(--ln)}.info h2{margin:0 0 6px;font-size:26px}
.who{display:flex;gap:12px;align-items:center;margin:10px 0;text-decoration:none!important}
.x{position:absolute;top:10px;right:10px;z-index:2;background:var(--sf);border:1px solid var(--ln);border-radius:50%;width:36px;height:36px;cursor:pointer}
.st{background:none;border:0;font-size:30px;cursor:pointer;color:var(--mute);opacity:.4;padding:0 2px}.st.on{color:#e8b53a;opacity:1}
.cmt{background:var(--bg);border-radius:10px;padding:10px 12px}
#drawer{position:fixed;left:72px;top:env(safe-area-inset-top,0px);bottom:0;width:340px;max-width:calc(100vw - 72px);background:var(--sf);border-right:1px solid var(--ln);z-index:25;padding:20px;overflow:auto;transform:translateX(-110%);transition:transform .25s}#drawer.open{transform:none}
#dev{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#dp{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;width:min(330px,calc(100vw - 32px));max-height:62vh;overflow:auto}#dp[hidden]{display:none}
#dl{margin:10px 0 0;padding-left:28px;font-size:14px}#dl a{color:var(--mute)}#dl a.cur{color:var(--acc);font-weight:600}
.ban{height:200px;border-radius:16px}.pv{padding:0 24px;margin-top:-52px}.pv .av{border:4px solid var(--bg)}.cimg{display:block;max-width:360px;width:100%;border-radius:10px;margin-top:6px}.unread{border-color:var(--acc)}.lg{background:#050608;border-radius:12px;overflow:hidden;width:46px;height:46px}.lg img{width:100%;height:100%;object-fit:contain;display:block;image-rendering:auto}.lgbig{width:96px;height:96px;object-fit:contain;display:block;border-radius:20px;background:#050608;margin:6px 0 12px;image-rendering:auto}.si svg{display:block;margin:auto}.btn svg{vertical-align:-3px;margin-right:4px}.th{width:72px;height:72px;object-fit:cover;border-radius:8px}.pv-av{width:96px;height:96px;border-radius:50%;object-fit:cover}.pv-w{background:var(--in);border-radius:12px;padding:12px;max-width:420px}.pv-w img{width:100%;max-height:320px;object-fit:contain;image-rendering:auto;display:block}.cmt a{color:var(--acc);word-break:break-all}@media(max-width:700px){.si{width:40px;font-size:20px}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:70}
@media(max-width:700px){#side{top:auto;left:0;right:0;bottom:0;width:auto;height:60px;flex-direction:row;justify-content:space-around;padding:6px;border-right:0;border-top:1px solid var(--ln)}.lg,#side>span{display:none}#top{margin-left:0;padding:10px 14px}#app{margin-left:0;padding:8px 14px 160px}#drawer{left:0;max-width:100vw;bottom:60px}#dev{bottom:calc(72px + env(safe-area-inset-bottom,0px))}.box{grid-template-columns:1fr;height:auto;max-height:92vh;overflow:auto}.pic{padding:12px}.info{overflow:visible;border-left:0;border-top:1px solid var(--ln)}}
</style>
</head>

<nav id="side" aria-label="Principal"></nav>
<aside id="drawer" aria-label="Notificaciones"></aside>
<div id="top"><button class="btn" id="bk" data-do="back" aria-label="Volver a la pantalla anterior">← Volver</button><form id="sf" onsubmit="return false"><input id="q" type="search" placeholder="Buscar por título, artista o etiqueta" aria-label="Buscar"></form><select id="so" aria-label="Ordenar"><option value="new">Más recientes</option><option value="old">Más antiguas</option><option value="az">A–Z</option><option value="za">Z–A</option><option value="top">Mayor calificación</option></select><div id="tr" class="row"></div></div>
<main id="app"></main>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<div class="modal" id="dlg"></div>
